in go. In the endings -ого and -его it is said व.",example:{ru:"го́род",dev:"ˈगोरत्",en:"city"}},{upper:"Д",lower:"д",name:"дэ́",nameDev:"ˈदे",dev:"द",kind:"consonant",sound:"d, made with the tongue on the teeth, exactly like Nepali द. Good news, no new sound to learn.",example:{ru:"до́м",dev:"ˈदोम्",en:"house"},note:"In handwriting the small д is often written like a Latin g."},{upper:"Е",lower:"е",name:"е́",nameDev:"ˈये",dev:"ये",kind:"vowel",looksLike:"Looks like a Latin E, but it is said ye.",sound:"ye as in yes, and it softens the consonant before it: не is न्ये. Unstressed it shrinks to इ.",example:{ru:"не́т",dev:"ˈन्येत्",en:"no"}},{upper:"Ё",lower:"ё",name:"ё",nameDev:"ˈयो",dev:"यो",kind:"vowel",sound:"yo, and always stressed. It softens the consonant before it.",example:{ru:"ёлка",dev:"ˈयोल्का",en:"fir tree"},note:"Printed books usually drop the two dots and write е. You still say यो."},{upper:"Ж",lower:"ж",name:"жэ́",nameDev:"ˈझ़े",dev:"झ़",kind:"consonant",sound:"zh, like the s in measure. Always hard, so и after it sounds like ы. At the end of a word it turns into श.",example:{ru:"жена́",dev:"झ़ि॒ˈना",en:"wife"}},{upper:"З",lower:"з",name:"зэ́",nameDev:"ˈज़े",dev:"ज़",kind:"consonant",looksLike:"Looks like the number 3, but it is z.",sound:"z, a buzzing sound, not ज. At the end of a word it turns into स.",example:{ru:"зима́",dev:"ज़िˈमा",en:"winter"}},{upper:"И",lower:"и",name:"и́",nameDev:"ˈइ",dev:"इ",kind:"vowel",looksLike:"Looks like a Latin N written backwards, but it is the vowel इ.",sound:"इ, and it softens the consonant before it.",example:{ru:"ми́р",dev:"ˈमिर्",en:"world, peace"},note:"In handwriting the small и looks like a Latin u."},{upper:"Й",lower:"й",name:"и кра́ткое",nameDev:"इ ˈक्रात्कया",dev:"य्",kind:"consonant",sound:"a short y, like the y in boy. It always closes a syllable or follows a vowel.",example:{ru:"мо́й",dev:"ˈमोय्",en:"my"}},{upper:"К",lower:"к",name:"ка́",nameDev:"ˈका",dev:"क",kind:"consonant",friend:!0,sound:"k, never breathy, the same as Nepali क.",example:{ru:"ко́т",dev:"ˈकोत्",en:"cat"}},{upper:"Л",lower:"л",name:"э́ль",nameDev:"ˈएल्य्",dev:"ल",kind:"consonant",sound:"Hard л is a dark l, with the back of the tongue raised, like the l in full. Soft ль is a light ल्य.",example:{ru:"ла́мпа",dev:"ˈलाम्पा",en:"lamp"}},{upper:"М",lower:"м",name:"э́м",nameDev:"ˈएम्",dev:"म",kind:"consonant",friend:!0,sound:"m.",example:{ru:"мо́ре",dev:"ˈमोरि",en:"sea"}},{upper:"Н",lower:"н",name:"э́н",nameDev:"ˈएन्",dev:"न",kind:"consonant",looksLike:"Looks like a Latin H, but it is n.",sound:"n.",example:{ru:"но́с",dev:"ˈनोस्",en:"nose"}},{upper:"О",lower:"о",name:"о́",nameDev:"ˈओ",dev:"ओ",kind:"vowel",friend:!0,sound:"A full rounded ओ, but only when stressed. Unstressed it becomes अ, the most important rule in Russian pronunciation.",example:{ru:"окно́",dev:"अक्ˈनो",en:"window"}},{upper:"П",lower:"п",name:"пэ́",nameDev:"ˈपे",dev:"प",kind:"consonant",looksLike:"Looks like the Greek letter pi. It is p.",sound:"p, never breathy, the same as Nepali प.",example:{ru:"па́па",dev:"ˈपापा",en:"dad"},note:"In handwriting the small п looks like a Latin n."},{upper:"Р",lower:"р",name:"э́р",nameDev:"ˈएर्",dev:"र",kind:"consonant",looksLike:"Looks like a Latin P, but it is r.",sound:"A rolled r, exactly like Nepali र. Good news, English speakers find this hard and you do not.",example:{ru:"рука́",dev:"रुˈका",en:"hand"}},{upper:"С",lower:"с",name:"э́с",nameDev:"ˈएस्",dev:"स",kind:"consonant",looksLike:"Looks like a Latin C, but it is always s.",sound:"s.",example:{ru:"со́к",dev:"ˈसोक्",en:"juice"}},{upper:"Т",lower:"т",name:"тэ́",nameDev:"ˈते",dev:"त",kind:"consonant",friend:!0,sound:"t, made with the tongue on the teeth, exactly like Nepali त. Good news again.",example:{ru:"та́м",dev:"ˈताम्",en:"there"},note:"In handwriting the small т looks like a Latin m. This is the letter that confuses everyone."},{upper:"У",lower:"у",name:"у́",nameDev:"ˈउ",dev:"उ",kind:"vowel",looksLike:"Looks like a Latin y, but it is the vowel उ.",sound:"उ with the lips well rounded and pushed forward. It never shrinks.",example:{ru:"у́тро",dev:"ˈउत्रा",en:"morning"}},{upper:"Ф",lower:"ф",name:"э́ф",nameDev:"ˈएफ़्",dev:"फ़",kind:"consonant",sound:"f, lower lip on the top teeth. Not the breathy Nepali फ.",example:{ru:"фо́то",dev:"ˈफ़ोता",en:"photo"}},{upper:"Х",lower:"х",name:"ха́",nameDev:"ˈख़ा",dev:"ख़",kind:"consonant",looksLike:"Looks like a Latin X, but it is a throaty kh.",sound:"A rough kh from the throat, like gently clearing it.",example:{ru:"хле́б",dev:"ˈख़्ल्येप्",en:"bread"}},{upper:"Ц",lower:"ц",name:"цэ́",nameDev:"ˈत्से",dev:"त्स",kind:"consonant",sound:"ts as one quick sound. Always hard.",example:{ru:"ци́рк",dev:"ˈत्सि॒र्क्",en:"circus"}},{upper:"Ч",lower:"ч",name:"че́",nameDev:"ˈचे",dev:"च",kind:"consonant",sound:"ch, always soft, a little lighter than Nepali च.",example:{ru:"ча́й",dev:"ˈचाय्",en:"tea"}},{upper:"Ш",lower:"ш",name:"ша́",nameDev:"ˈशा",dev:"श",kind:"consonant",looksLike:"Looks like a Latin W upside down. It is sh.",sound:"sh, always hard, with the tongue pulled back. и after it sounds like ы.",example:{ru:"шко́ла",dev:"ˈश्कोला",en:"school"}},{upper:"Щ",lower:"щ",name:"ща́",nameDev:"ˈश्शा",dev:"श्श",kind:"consonant",sound:"A long soft sh, softer and longer than ш. Always soft.",example:{ru:"бо́рщ",dev:"ˈबोर्श्श्",en:"borscht, beetroot soup"}},{upper:"Ъ",lower:"ъ",name:"твёрдый зна́к",nameDev:"ˈत्व्योर्दि॒य् ˈज़्नाक्",dev:"a short break",kind:"sign",sound:"No sound of its own. The hard sign makes a short break before the next vowel.",example:{ru:"подъе́зд",dev:"पद्ˈयेस्त्",en:"entrance of a building"}},{upper:"Ы",lower:"ы",name:"ы́",nameDev:"ˈइ॒",dev:"इ॒",kind:"vowel",looksLike:"Looks like a b with an l. It is one vowel.",sound:"No Nepali equivalent. Start saying इ, then pull the whole tongue back without moving the lips.",example:{ru:"сы́р",dev:"ˈसि॒र्",en:"cheese"}},{upper:"Ь",lower:"ь",name:"мя́гкий зна́к",nameDev:"ˈम्याख़्किय् ˈज़्नाक्",dev:"्य्",kind:"sign",sound:"No sound of its own. The soft sign makes the consonant before it soft, as if a small य were hiding in it.",example:{ru:"ма́ть",dev:"ˈमात्य्",en:"mother"}},{upper:"Э",lower:"э",name:"э́",nameDev:"ˈए",dev:"ए",kind:"vowel",sound:"A plain ए as in bed, with no य before it. Unstressed it becomes इ.",example:{ru:"э́то",dev:"ˈएता",en:"this, it is"}},{upper:"Ю",lower:"ю",name:"ю́",nameDev:"ˈयु",dev:"यु",kind:"vowel",sound:"yu, and it softens the consonant before it.",example:{ru:"ю́г",dev:"ˈयुक्",en:"south"}},{upper:"Я",lower:"я",name:"я́",nameDev:"ˈया",dev:"या",kind:"vowel",looksLike:"Looks like a Latin R written backwards. It is ya.",sound:"ya, and it softens the consonant before it. Unstressed it shrinks to इ.",example:{ru:"я́блоко",dev:"ˈयाब्लका",en:"apple"}}],a0=[["а","я"],["э","е"],["ы","и"],["о","ё"],["у","ю"]],u0=[{id:"stress",title:"Stress decides everything",summary:"One syllable in every Russian word is said louder and longer. Nothing in the spelling tells you which, so learn it with the word.",body:["Russian stress can fall on any syllable, and it can move when the word changes form: го́род is a city, города́ is cities.","Two words can be spelled the same and differ only by stress. Get the stress wrong and you say a different word.","In this app the stressed vowel carries an accent in Cyrillic and the stressed syllable is bold and underlined in red in Devanagari. Real Russian books do not print the accent, so learn it now while you can see it."],examples:[{ru:"за́мок",dev:"ˈज़ामक्",en:"castle"},{ru:"замо́к",dev:"ज़ˈमोक्",en:"lock"},{ru:"му́ка",dev:"ˈमुका",en:"torment"},{ru:"мука́",dev:"मुˈका",en:"flour"},{ru:"го́род",dev:"ˈगोरत्",en:"city"},{ru:"города́",dev:"गरˈदा",en:"cities"}]},{id:"akanye",title:"Unstressed о and а become अ",summary:"Only the stressed о is ओ. Every other о, and every unstressed а, is a short relaxed अ.",body:["This single rule fixes more of a foreign accent than anything else. Reading о as ओ everywhere is the mark of a beginner.","Inside a word the reduced vowel is the plain अ that every Devanagari consonant already carries: молоко́ is written मलˈको and you say all three syllables."],examples:[{ru:"молоко́",dev:"मलˈको",en:"milk"},{ru:"хорошо́",dev:"ख़रˈशो",en:"good, well"},{ru:"голова́",dev:"गलˈवा",en:"head"},{ru:"соба́ка",dev:"सˈबाका",en:"dog"},{ru:"Москва́",dev:"मस्ˈक्वा",en:"Moscow"},{ru:"окно́",dev:"अक्ˈनो",en:"window"}],tip:"Say the word with the stressed syllable loud, then let every other vowel fall into a lazy अ. That is how it sounds in Moscow."},{id:"ikanye",title:"Unstressed е and я become इ",summary:"When е or я is not stressed it shrinks to a short इ, and the consonant before it stays soft.",body:["сего́дня is not सेगोद्न्या. The е is unstressed so it becomes इ, and the г is said as व, so it is सिˈवोद्न्या.","The same happens to unstressed э at the start of a word: эта́ж is इˈताश्."],examples:[{ru:"сего́дня",dev:"सिˈवोद्न्या",en:"today"},{ru:"язы́к",dev:"यिˈज़ि॒क्",en:"language, tongue"},{ru:"тепе́рь",dev:"तिˈप्येर्य्",en:"now"},{ru:"сестра́",dev:"सिस्ˈत्रा",en:"sister"},{ru:"река́",dev:"रिˈका",en:"river"},{ru:"пятно́",dev:"पित्ˈनो",en:"stain"}]},{id:"final",title:"The last vowel is short",summary:"An unstressed vowel at the very end of a word is said short and light. It is written ा and said quickly, never long.",body:["This is why Russians seem to say spasiba. They do. спаси́бо has stress on си, so the final о is reduced.","Do not drop the vowel altogether. A light short sound stays there."],examples:[{ru:"спаси́бо",dev:"स्पˈसिबा",en:"thank you"},{ru:"э́то",dev:"ˈएता",en:"this, it is"},{ru:"сло́во",dev:"ˈस्लोवा",en:"word"},{ru:"вре́мя",dev:"ˈव्र्येम्या",en:"time"},{ru:"ма́ма",dev:"ˈमामा",en:"mum"},{ru:"у́тро",dev:"ˈउत्रा",en:"morning"}]},{id:"soft",title:"Hard and soft consonants",summary:"Almost every consonant has a hard and a soft version. Soft means the middle of the tongue rises, as if a small य were hiding inside it.",body:["A consonant is soft when it is followed by я, ё, ю, е, и or the soft sign ь.","The app writes softness one way only. Before an आ, ओ, उ or ए sound: the consonant joined to य, as in न्ये. Before an इ sound: nothing extra, because इ already softens. At the end of a word or before another consonant: ्य्, as in मात्य्, meaning close the sound with the tongue pressed up and add no vowel.","Hard and soft change the meaning, so the pairs below are different words."],examples:[{ru:"ма́т",dev:"ˈमात्",en:"checkmate"},{ru:"ма́ть",dev:"ˈमात्य्",en:"mother"},{ru:"лу́к",dev:"ˈलुक्",en:"onion"},{ru:"лю́к",dev:"ˈल्युक्",en:"hatch"},{ru:"бы́л",dev:"ˈबि॒ल्",en:"was"},{ru:"би́л",dev:"ˈबिल्",en:"hit"},{ru:"не́т",dev:"ˈन्येत्",en:"no"},{ru:"де́нь",dev:"ˈद्येन्य्",en:"day"}]},{id:"hard-only",title:"ж, ш and ц are always hard",summary:"These three never soften, whatever letter comes next. After them и and е sound like ы, and е, ё are said without a य.",body:["Spelling rules make Russians write жи, ши, це, but the sound is hard: жить is said ˈझ़ि॒त्य्.","The app never writes ्य after झ़, श or त्स."],examples:[{ru:"жи́ть",dev:"ˈझ़ि॒त्य्",en:"to live"},{ru:"жена́",dev:"झ़ि॒ˈना",en:"wife"},{ru:"ше́сть",dev:"ˈशेस्त्य्",en:"six"},{ru:"цена́",dev:"त्सि॒ˈना",en:"price"},{ru:"жёлтый",dev:"ˈझ़ोल्ति॒य्",en:"yellow"},{ru:"ши́на",dev:"ˈशि॒ना",en:"tyre"}]},{id:"soft-only",title:"ч, щ and й are always soft",summary:"These never harden. Unstressed а after ч or щ shrinks to इ, just as я does.",body:["ч is a light च. щ is a long soft श्श, with no च in it in modern speech.","й is a short य that closes a syllable: мой is ˈमोय्."],examples:[{ru:"ча́с",dev:"ˈचास्",en:"hour"},{ru:"часы́",dev:"चिˈसि॒",en:"clock, watch"},{ru:"щи́",dev:"ˈश्शि",en:"cabbage soup"},{ru:"ещё",dev:"यिˈश्शो",en:"still, more"},{ru:"ча́й",dev:"ˈचाय्",en:"tea"},{ru:"мо́й",dev:"ˈमोय्",en:"my"}]},{id:"yery",title:"The sound ы",summary:"ы has no Nepali equivalent. It is written इ॒, इ with a bar under it. When you see the bar, pull your tongue back.",body:["Say इ. Now, without moving your lips, slide the whole tongue back in the mouth, as if it were trying to touch the back of your throat. That is ы.","The difference between ы and и is the difference between two words, so practise the pairs below with the speaker button."],examples:[{ru:"ты́",dev:"ˈति॒",en:"you, to a friend"},{ru:"мы́",dev:"ˈमि॒",en:"we"},{ru:"сы́р",dev:"ˈसि॒र्",en:"cheese"},{ru:"бы́ть",dev:"ˈबि॒त्य्",en:"to be"},{ru:"би́ть",dev:"ˈबित्य्",en:"to hit"},{ru:"ры́ба",dev:"ˈरि॒बा",en:"fish"}]},{id:"devoicing",title:"The last consonant loses its voice",summary:"At the end of a word б, в, г, д, ж and з are said as п, ф, к, т, ш and с.",body:["Your throat stops buzzing at the end of the word. Written хлеб, said ख़्ल्येप्.","In Devanagari: ब becomes प, व becomes फ़, ग becomes क, द becomes त, झ़ becomes श, ज़ becomes स."],examples:[{ru:"хле́б",dev:"ˈख़्ल्येप्",en:"bread"},{ru:"дру́г",dev:"ˈद्रुक्",en:"friend"},{ru:"му́ж",dev:"ˈमुश्",en:"husband"},{ru:"ра́з",dev:"ˈरास्",en:"once, time"},{ru:"кро́вь",dev:"ˈक्रोफ़्य्",en:"blood"},{ru:"го́д",dev:"ˈगोत्",en:"year"}]},{id:"assimilation",title:"Neighbours change each other",summary:"When two consonants meet, the second decides for the first: both buzz or neither does.",body:["д before к loses its buzz and becomes т. с before д gains a buzz and becomes з. в before a voiceless consonant becomes ф.","Short prepositions join the next word and follow the same rule: в до́ме is said as one word."],examples:[{ru:"во́дка",dev:"ˈवोत्का",en:"vodka"},{ru:"ло́жка",dev:"ˈलोश्का",en:"spoon"},{ru:"всё",dev:"ˈफ़्स्यो",en:"everything"},{ru:"сде́лать",dev:"ˈज़्द्येलत्य्",en:"to do, to make"},{ru:"вокза́л",dev:"वग्ˈज़ाल्",en:"railway station"},{ru:"вчера́",dev:"फ़्चिˈरा",en:"yesterday"}]},{id:"silent",title:"Letters that are written but not said",summary:"In some clusters one consonant disappears in speech. Russians simply skip it.",body:["The most famous is здра́вствуйте, where the first в is never said.","These are fixed in the words themselves, so learn each word with its sound."],examples:[{ru:"здра́вствуйте",dev:"ˈज़्द्रास्त्वुय्ति",en:"hello, polite"},{ru:"со́лнце",dev:"ˈसोन्त्सा",en:"sun"},{ru:"се́рдце",dev:"ˈस्येर्त्सा",en:"heart"},{ru:"пра́здник",dev:"ˈप्राज़्निक्",en:"holiday"},{ru:"чу́вство",dev:"ˈचुस्त्वा",en:"feeling"},{ru:"ле́стница",dev:"ˈल्येस्नित्सा",en:"staircase"}]},{id:"special",title:"Spellings that lie",summary:"A few common spellings are always said differently: г in -ого and -его is व, -тся and -ться are त्सा, and чт and чн are often श्त and श्न.",body:["These appear in almost every sentence, so they are worth learning now."],examples:[{ru:"его́",dev:"यिˈवो",en:"his, him"},{ru:"большо́го",dev:"बल्य्ˈशोवा",en:"of a big one"},{ru:"учи́ться",dev:"उˈचित्सा",en:"to study"},{ru:"нра́вится",dev:"ˈन्रावित्सा",en:"is liked"},{ru:"что́",dev:"ˈश्तो",en:"what, that"},{ru:"коне́чно",dev:"कˈन्येश्ना",en:"of course"}]},{id:"clusters",title:"Clusters that look impossible",summary:"Russian puts three or four consonants together. Say every one, and do not slip an अ between them.",body:["A Nepali habit is to break a cluster with a vowel. Resist it: every consonant in a Russian cluster carries a halant in the Devanagari, and nothing is added.","Go slowly first, one consonant at a time, then speed up."],examples:[{ru:"взгля́д",dev:"ˈव्ज़्ग्ल्यात्",en:"glance"},{ru:"встре́ча",dev:"ˈफ़्स्त्र्येचा",en:"meeting"},{ru:"всегда́",dev:"फ़्सिग्ˈदा",en:"always"},{ru:"здра́вствуй",dev:"ˈज़्द्रास्त्वुय्",en:"hello, to a friend"},{ru:"мгла́",dev:"ˈम्ग्ला",en:"haze"},{ru:"тка́нь",dev:"ˈत्कान्य्",en:"fabric"}]},{id:"l",title:"Hard л and soft ль",summary:"Hard л is a dark l with the back of the tongue raised. Soft ль is a light ल्य.",body:["For hard л, put the tip of the tongue on the teeth and lift the back of the tongue at the same time. It sounds like the l in the English word full.","For soft ль, press the middle of the tongue up, close to ल्य."],examples:[{ru:"ла́мпа",dev:"ˈलाम्पा",en:"lamp"},{ru:"сто́л",dev:"ˈस्तोल्",en:"table"},{ru:"у́гол",dev:"ˈउगल्",en:"corner"},{ru:"у́голь",dev:"ˈउगल्य्",en:"coal"},{ru:"ле́то",dev:"ˈल्येता",en:"summer"},{ru:"бо́ль",dev:"ˈबोल्य्",en:"pain"}]},{id:"nepali",title:"Where Nepali gives you a head start",summary:"Three Russian sounds are hard for English speakers and easy for you.",body:["т and д are dental, made with the tongue on the teeth, exactly like Nepali त and द. English t and d are made further back.","р is rolled exactly like Nepali र.","п, т and к are never breathy in Russian, and neither are Nepali प, त, क. English speakers add a puff of air and sound foreign. You will not. Because Russian has no breathy sounds, the app never uses ख घ छ झ ठ ढ थ ध फ भ."],examples:[{ru:"то́т",dev:"ˈतोत्",en:"that one"},{ru:"да́",dev:"ˈदा",en:"yes"},{ru:"ру́сский",dev:"ˈरुस्किय्",en:"Russian"},{ru:"ко́т",dev:"ˈकोत्",en:"cat"},{ru:"па́па",dev:"ˈपापा",en:"dad"},{ru:"дорога́",dev:"दरˈगा",en:"road"}],tip:"Trust your Nepali mouth for т, д, р, п and к. Spend your effort on ы, on soft consonants and on reducing vowels."},{id:"signs",title:"The hard sign and the soft sign before a vowel",summary:"When ъ or ь stands before я, е, ё or ю, it makes a short break, and the vowel starts with a clear य.",body:["The soft sign also softens the consonant before it, so семья́ is सिम्य्ˈया: a soft म, a tiny break, then या.","The hard sign leaves the consonant hard: подъе́зд is पद्ˈयेस्त्."],examples:[{ru:"семья́",dev:"सिम्य्ˈया",en:"family"},{ru:"статья́",dev:"स्तत्य्ˈया",en:"article"},{ru:"подъе́зд",dev:"पद्ˈयेस्त्",en:"entrance of a building"},{ru:"объе́кт",dev:"अब्ˈयेक्त्",en:"object"}]},{id:"intonation",title:"Questions are made by the voice",summary:"A yes or no question uses exactly the same words as the statement. Only the voice changes: it rises sharply on the word being asked about, then falls.",body:["Ты до́ма. You are at home. Ты до́ма? Are you at home? The pitch jumps up on до́ма.","Move the rise and you change the question. Rising on до́ма asks about home. Rising on ты asks whether it is you, and not someone else, who is at home."],examples:[{ru:"Ты до́ма.",dev:"ति॒ ˈदोमा",en:"You are at home."},{ru:"Ты до́ма?",dev:"ति॒ ˈदोमा",en:"Are you at home?",note:"Voice rises on до́ма."},{ru:"Э́то ваш дом?",dev:"ˈएता वाश् दोम्",en:"Is this your house?",note:"Voice rises on ва́ш if you are asking whose it is."}]}],i0=["Counting","Tens and hundreds","Ordinals","Time","Dates","Money","Age"],s0=[{value:"0",ru:"но́ль",dev:"ˈनोल्य्",en:"zero",group:"Counting"},{value:"1",ru:"оди́н",dev:"अˈदिन्",en:"one",group:"Counting",note:"Changes with gender: одна́ अद्ˈना for feminine, одно́ अद्ˈनो for neuter."},{value:"2",ru:"два́",dev:"ˈद्वा",en:"two",group:"Counting",note:"две́ ˈद्व्ये with feminine nouns: две́ кни́ги."},{value:"3",ru:"три́",dev:"ˈत्रि",en:"three",group:"Counting"},{value:"4",ru:"четы́ре",dev:"चिˈति॒रि",en:"four",group:"Counting"},{value:"5",ru:"пя́ть",dev:"ˈप्यात्य्",en:"five",group:"Counting"},{value:"6",ru:"ше́сть",dev:"ˈशेस्त्य्",en:"six",group:"Counting"},{value:"7",ru:"се́мь",dev:"ˈस्येम्य्",en:"seven",group:"Counting"},{value:"8",ru:"во́семь",dev:"ˈवोसिम्य्",en:"eight",group:"Counting"},{value:"9",ru:"де́вять",dev:"ˈद्येवित्य्",en:"nine",group:"Counting"},{value:"10",ru:"де́сять",dev:"ˈद्येसित्य्",en:"ten",group:"Counting"},{value:"11",ru:"оди́ннадцать",dev:"अˈदिनत्सत्य्",en:"eleven",group:"Counting",note:"дц is said as one त्स."},{value:"12",ru:"двена́дцать",dev:"द्विˈनात्सत्य्",en:"twelve",group:"Counting"},{value:"20",ru:"два́дцать",dev:"ˈद्वात्सत्य्",en:"twenty",group:"Tens and hundreds"},{value:"100",ru:"сто́",dev:"ˈस्तो",en:"one hundred",group:"Tens and hundreds"},{value:"1000",ru:"ты́сяча",dev:"ˈति॒सिचा",en:"one thousand",group:"Tens and hundreds"}],r0=[{id:"number-case",title:"Numbers choose the case of the noun",level:"A1",topic:"Numbers",rule:"After 1 the noun stays as it is. After 2, 3 and 4 it goes into the genitive singular. From 5 to 20 it goes into the genitive plural. For bigger numbers only the last word counts: 21 behaves like 1, 22 like 2, 25 like 5.",why:"Historically 2, 3 and 4 were followed by a special pair form that later merged with the genitive singular, and 5 and above were nouns meaning a group of five, so what follows is of the group, in the genitive plural.",examples:[{ru:"оди́н го́д",dev:"अˈदिन् ˈगोत्",en:"one year"},{ru:"два́ го́да",dev:"ˈद्वा ˈगोदा",en:"two years"},{ru:"пя́ть ле́т",dev:"ˈप्यात्य् ˈल्येत्",en:"five years",note:"ле́т is the genitive plural used for years after numbers."},{ru:"два́дцать оди́н го́д",dev:"ˈद्वात्सत्य् अˈदिन् ˈगोत्",en:"twenty one years"},{ru:"три́ ру́бля",dev:"ˈत्रि ˈरुब्ल्या",en:"three roubles"},{ru:"де́сять рубле́й",dev:"ˈद्येसित्य् रुब्ˈल्येय्",en:"ten roubles"}],mistakes:["Using the plural after 2, 3 and 4. It is два́ го́да, never два́ го́ды.","Forgetting that 11 to 14 behave like 5, not like 1 to 4: оди́ннадцать ле́т."],exceptions:["Years after numbers use ле́т, not годо́в.","Adjectives after 2, 3 and 4 go into the genitive plural even though the noun is singular: два́ больши́х до́ма."]}],c0=["Basics","People","Family","Body","Food","Home","City","Travel","Work","Time","Weather","Nature","Emotions","Technology","Describing","Actions"],o0=[{ru:"молоко́",dev:"मलˈको",en:"milk",pos:"noun",gender:"n",gen:"молока́",ex:"Я пью молоко́ ка́ждое у́тро.",exEn:"I drink milk every morning.",level:"A1",theme:"Food"},{ru:"хле́б",dev:"ˈख़्ल्येप्",en:"bread",pos:"noun",gender:"m",gen:"хле́ба",ex:"Э́тот хлеб о́чень све́жий.",exEn:"This bread is very fresh.",level:"A1",theme:"Food"},{ru:"вода́",dev:"वˈदा",en:"water",pos:"noun",gender:"f",gen:"воды́",plural:"во́ды",ex:"Мо́жно стака́н воды́?",exEn:"Could I have a glass of water?",level:"A1",theme:"Food"},{ru:"ча́й",dev:"ˈचाय्",en:"tea",pos:"noun",gender:"m",gen:"ча́я",ex:"Ты бу́дешь чай?",exEn:"Will you have some tea?",level:"A1",theme:"Food"},{ru:"я́блоко",dev:"ˈयाब्लका",en:"apple",pos:"noun",gender:"n",gen:"я́блока",plural:"я́блоки",ex:"Я ем я́блоко.",exEn:"I am eating an apple.",level:"A1",theme:"Food"},{ru:"до́м",dev:"ˈदोम्",en:"house, home",pos:"noun",gender:"m",gen:"до́ма",plural:"дома́",ex:"Наш дом стои́т у реки́.",exEn:"Our house stands by the river.",level:"A1",theme:"Home"},{ru:"ко́мната",dev:"ˈकोम्नता",en:"room",pos:"noun",gender:"f",gen:"ко́мнаты",ex:"Э́то моя́ ко́мната.",exEn:"This is my room.",level:"A1",theme:"Home"},{ru:"ма́ма",dev:"ˈमामा",en:"mum",pos:"noun",gender:"f",gen:"ма́мы",ex:"Ма́ма гото́вит у́жин.",exEn:"Mum is cooking dinner.",level:"A1",theme:"Family"},{ru:"оте́ц",dev:"अˈत्येत्स्",en:"father",pos:"noun",gender:"m",gen:"отца́",ex:"Мой оте́ц рабо́тает врачо́м.",exEn:"My father works as a doctor.",level:"A1",theme:"Family"},{ru:"семья́",dev:"सिम्य्ˈया",en:"family",pos:"noun",gender:"f",gen:"семьи́",ex:"У меня́ больша́я семья́.",exEn:"I have a big family.",level:"A1",theme:"Family"},{ru:"дру́г",dev:"ˈद्रुक्",en:"friend",pos:"noun",gender:"m",gen:"дру́га",plural:"друзья́",ex:"Он мой лу́чший друг.",exEn:"He is my best friend.",level:"A1",theme:"People"},{ru:"рука́",dev:"रुˈका",en:"hand, arm",pos:"noun",gender:"f",gen:"руки́",plural:"ру́ки",ex:"У меня́ боли́т рука́.",exEn:"My arm hurts.",level:"A1",theme:"Body"},{ru:"голова́",dev:"गलˈवा",en:"head",pos:"noun",gender:"f",gen:"головы́",plural:"го́ловы",ex:"У меня́ боли́т голова́.",exEn:"I have a headache.",level:"A1",theme:"Body"},{ru:"го́род",dev:"ˈगोरत्",en:"city, town",pos:"noun",gender:"m",gen:"го́рода",plural:"города́",ex:"Москва́ о́чень большо́й го́род.",exEn:"Moscow is a very big city.",level:"A1",theme:"City"},{ru:"у́лица",dev:"ˈउलित्सा",en:"street",pos:"noun",gender:"f",gen:"у́лицы",ex:"Я живу́ на э́той у́лице.",exEn:"I live on this street.",level:"A1",theme:"City"},{ru:"по́езд",dev:"ˈपोयिस्त्",en:"train",pos:"noun",gender:"m",gen:"по́езда",plural:"поезда́",ex:"По́езд опа́здывает.",exEn:"The train is late.",level:"A1",theme:"Travel"},{ru:"рабо́та",dev:"रˈबोता",en:"work, job",pos:"noun",gender:"f",gen:"рабо́ты",ex:"Я иду́ на рабо́ту.",exEn:"I am going to work.",level:"A1",theme:"Work"},{ru:"вра́ч",dev:"ˈव्राच्",en:"doctor",pos:"noun",gender:"m",gen:"врача́",ex:"Мне ну́жен врач.",exEn:"I need a doctor.",level:"A1",theme:"Work"},{ru:"вре́мя",dev:"ˈव्र्येम्या",en:"time",pos:"noun",gender:"n",gen:"вре́мени",plural:"времена́",ex:"У меня́ нет вре́мени.",exEn:"I have no time.",level:"A1",theme:"Time"},{ru:"сего́дня",dev:"सिˈवोद्न्या",en:"today",pos:"adverb",ex:"Сего́дня я до́ма.",exEn:"Today I am at home.",level:"A1",theme:"Time"},{ru:"пого́да",dev:"पˈगोदा",en:"weather",pos:"noun",gender:"f",gen:"пого́ды",ex:"Сего́дня хоро́шая пого́да.",exEn:"The weather is nice today.",level:"A1",theme:"Weather"},{ru:"со́лнце",dev:"ˈसोन्त्सा",en:"sun",pos:"noun",gender:"n",gen:"со́лнца",ex:"Све́тит со́лнце.",exEn:"The sun is shining.",level:"A1",theme:"Nature"},{ru:"ра́дость",dev:"ˈरादस्त्य्",en:"joy",pos:"noun",gender:"f",gen:"ра́дости",ex:"Кака́я ра́дость!",exEn:"What a joy!",level:"A2",theme:"Emotions"},{ru:"телефо́н",dev:"तिलिˈफ़ोन्",en:"phone",pos:"noun",gender:"m",gen:"телефо́на",ex:"Где мой телефо́н?",exEn:"Where is my phone?",level:"A1",theme:"Technology"},{ru:"хоро́ший",dev:"ख़ˈरोशि॒य्",en:"good",pos:"adjective",ex:"Э́то хоро́шая иде́я.",exEn:"That is a good idea.",level:"A1",theme:"Describing"},{ru:"большо́й",dev:"बल्य्ˈशोय्",en:"big, large",pos:"adjective",ex:"У них большо́й сад.",exEn:"They have a big garden.",level:"A1",theme:"Describing"},{ru:"люби́ть",dev:"ल्युˈबित्य्",en:"to love, to like",pos:"verb",ex:"Я люблю́ чита́ть.",exEn:"I love reading.",level:"A1",theme:"Actions"},{ru:"жи́ть",dev:"ˈझ़ि॒त्य्",en:"to live",pos:"verb",ex:"Где ты живёшь?",exEn:"Where do you live?",level:"A1",theme:"Actions"},{ru:"говори́ть",dev:"गवˈरित्य्",en:"to speak, to say",pos:"verb",ex:"Вы говори́те по-ру́сски?",exEn:"Do you speak Russian?",level:"A1",theme:"Actions"},{ru:"спаси́бо",dev:"स्पˈसिबा",en:"thank you",pos:"interjection",ex:"Спаси́бо за по́мощь!",exEn:"Thanks for the help!",level:"A1",theme:"Basics"}],f0=["Nouns","Sentences","Negation and questions","Pronouns","Adjectives","Prepositions","Comparison","Participles"],d0=[{id:"gender",title:"Every noun has a gender",level:"A1",topic:"Nouns",rule:"Every noun is masculine, feminine or neuter, and the ending almost always tells you which. Masculine nouns end in a consonant or й. Feminine nouns end in а or я. Neuter nouns end in о or е. Nouns ending in ь can be masculine or feminine, so learn those with the word.",why:"Gender decides the ending of every adjective, every past tense verb and every pronoun that goes with the noun. You will use it in almost every sentence.",examples:[{ru:"Э́то мой дом.",dev:"ˈएता मोय् दोम्",en:"This is my house.",note:"до́м ends in a consonant, so it is masculine and takes мой."},{ru:"Э́то моя́ ко́мната.",dev:"ˈएता मˈया ˈकोम्नता",en:"This is my room.",note:"ко́мната ends in а, so it is feminine and takes моя́."},{ru:"Э́то моё окно́.",dev:"ˈएता मˈयो अक्ˈनो",en:"This is my window.",note:"окно́ ends in о, so it is neuter and takes моё."}],mistakes:["Guessing that every noun in ь is feminine. де́нь and слова́рь are masculine, ночь and дверь are feminine.","Matching the possessive to yourself instead of to the noun. A man still says моя́ ко́мната."],exceptions:["па́па, дя́дя and мужчи́на end in а or я but are masculine, because they are men.","вре́мя, и́мя and the other nouns ending in мя are neuter.","ко́фе is masculine, even though it looks neuter."]},{id:"articles",title:"There are no articles",level:"A1",topic:"Sentences",rule:"Russian has no words for a, an or the. кни́га means a book or the book, and context decides which.",why:"Word order does the job instead. Something new usually comes at the end of the sentence, something already known comes at the start.",examples:[{ru:"Я ви́жу соба́ку.",dev:"या ˈविझ़ु सˈबाकु",en:"I see a dog. Or: I see the dog."},{ru:"Кни́га на столе́.",dev:"ˈक्निगा न स्तˈल्ये",en:"The book is on the table.",note:"The book is known, so it comes first."},{ru:"На столе́ кни́га.",dev:"न स्तˈल्ये ˈक्निगा",en:"There is a book on the table.",note:"The book is new information, so it comes last."}],mistakes:["Looking for a word to translate the. There is none, and adding э́тот everywhere sounds heavy, because э́тот means this.","Forgetting that there is also no word for is in the present tense: Кни́га на столе́ has no verb at all."],exceptions:["оди́н can mean a certain: Оди́н челове́к сказа́л means A man said, a man I will not name."]},{id:"negation",title:"Saying no with не and нет",level:"A1",topic:"Negation and questions",rule:"Put не directly before the word you are denying. нет means no, or there is not. Russian also uses double negatives: никто́ не, ничего́ не, никогда́ не.",why:"не always sits right before the word it cancels, so moving it changes what you deny. A double negative does not cancel itself in Russian, it makes the no stronger.",examples:[{ru:"Я не зна́ю.",dev:"या नि ˈज़्नायु",en:"I do not know."},{ru:"Э́то не мой телефо́н.",dev:"ˈएता नि मोय् तिलिˈफ़ोन्",en:"This is not my phone."},{ru:"У меня́ нет вре́мени.",dev:"उ मिˈन्या न्येत् ˈव्र्येमिनि",en:"I have no time.",note:"нет takes the genitive: вре́мя becomes вре́мени."},{ru:"Я никогда́ не́ был в Москве́.",dev:"या निकग्ˈदा ˈन्ये बि॒ल् व्मस्ˈक्व्ये",en:"I have never been to Moscow.",note:"Stress jumps onto не́ before был."}],mistakes:["Dropping не after никогда́, ничего́ or никто́. Я никогда́ был is wrong. Russian needs both words.","Using нет where не belongs. нет is a full no; не is the not inside a sentence."],exceptions:["With some short past tense verbs the stress moves onto не: не́ был, не́ было, не́ были. But не была́ keeps it at the end."]}],h0=[{id:"prepositional",name:"Prepositional",ru:"предло́жный паде́ж",dev:"प्रिद्ˈलोझ़्नि॒य् पˈद्येश्",questions:"о ко́м? о чём? где́?",order:6,summary:"The case for where something is, and for what you are talking or thinking about. It is the only case that never appears without a preposition, which is how it got its name.",uses:["Location with в (in) and на (on, at): в до́ме, на столе́.","The topic of talking, thinki
